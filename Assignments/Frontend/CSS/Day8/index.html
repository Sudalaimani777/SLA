<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <a href="https://www.google.com">Google</a>
    <a href="#">Dummy</a>
    <a href="https://www.facebook.com">Facebook </a>
    <a href="dummy.org">Mail</a>
    <a href="https://www.meta.com">Meta</a>

    <div class="wrapper container">
        <h1>CSS Selector</h1>
        <p>This is a paragraph.</p>
        <p class="text">This is a paragraph with class text.</p>
        <p id="unique">This is a paragraph with id unique.</p>
        <span>This is a span element.</span>
        <span class="highlight">This is a highlighted span element.</span>
    </div>
</body>
</html>
