<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <header>
        <h1>Sign Up</h1>
    </header>
    <main>
        <section>
            <form action="">
                <p>
                    <label for="firstName">First Name :</label>
                    <input type="text" name="firstName" id="firstName" required placeholder="Enter your first name">
                </p>
                <p>
                    <label for="lastName">Last Name :</label>
                    <input type="text" name="lastName" id="lastName" required placeholder="Enter your last name">
                </p>
                <p>
                    <label for="email">Email :</label>
                    <input type="email" name="email" id="email" required placeholder="Enter your email">
                </p>
                <p>
                    <label for="phone">Phone Number :</label>
                    <input type="tel" name="phone" id="phone" required placeholder="Enter your phone number">
                </p>
                <p>
                    <label for="password">Password :</label>
                    <input type="password" name="password" id="password" required placeholder="Enter your password">
                </p>
                <p>
                    <label for="rePassword">Re-enter Password :</label>
                    <input type="password" name="rePassword" id="rePassword" required placeholder="Re-enter your password">
                </p>
                <p>
                    <input type="checkbox" name="tc" id="tc" required>
                    <label for="tc">I agree to the Terms and Conditions</label>
                </p>
                <p>
                    <input type="submit" value="Sign Up">
                </p>
                <p>
                    <span>Already have an account? <a href="./signIn.html">Sign In</a></span>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
