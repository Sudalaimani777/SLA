<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 CSS</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        p {
            color: blue;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <h1>This is the external Style</h1>
    <!-- There are three types to use the CSS, such as inline, internal and external CSS -->
    <!-- Inline CSS -->
    <p style="color: red; background-color: rgb(225, 0, 255);">This is the inline Style</p>

    <!-- Internal CSS -->
    <!-- This type of styling is used in the head of the document -->

    <p>This is the internal Style</p>

    <!-- External CSS -->
    <!-- The external CSS is linked to the HTML document using the link tag -->
</body>

</html>
