<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe</title>
</head>
<body>
    <header>
        <h1>
            iFrame Example
        </h1>
    </header>
    <main>
        <section>
            <h2>Embedded Table</h2>
            <iframe src="table.html" width="600" height="400" title="Table iFrame"></iframe>
            <iframe width="500" height="315" src="https://www.youtube.com/embed/G8gSNP8G1_U?si=peVZ5rHQc6L-ijpH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>

        <section>
            <embed src="/Images/Kaido.jpg" type="image/jpeg" width="200">
        </section>
    </main>
</body>
</html>
